<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GP Secure System — Patient Registration</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast"><span class="tag">OK</span><span class="msg"></span></div>

  <div class="auth-page">
    <div class="auth-brand">
      <div class="dot"></div>
      GP Secure System
    </div>

    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Create an account</h2>
        <p>Register as a new patient. Your GP will be automatically assigned.</p>
      </div>

      <div class="auth-card-body">
        <div class="form-row">
          <div class="form-group">
            <label>First Name <span class="muted">(optional)</span></label>
            <input id="firstName" type="text" placeholder="Jane" autocomplete="given-name" />
          </div>
          <div class="form-group">
            <label>Last Name <span class="muted">(optional)</span></label>
            <input id="lastName" type="text" placeholder="Smith" autocomplete="family-name" />
          </div>
        </div>

        <div class="form-group">
          <label>Username <span class="text-err">*</span></label>
          <input id="username" type="text" placeholder="Choose a username" autocomplete="username" />
        </div>

        <div class="form-group">
          <label>Email <span class="muted">(optional)</span></label>
          <input id="email" type="email" placeholder="jane@example.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label>Password <span class="text-err">*</span></label>
          <input id="password" type="password" placeholder="Create a strong password" autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label>Confirm Password <span class="text-err">*</span></label>
          <input id="password2" type="password" placeholder="Repeat your password" autocomplete="new-password" />
        </div>

        <button id="btnRegister" class="btn btn-full">Create Account</button>
      </div>

      <div class="auth-card-footer">
        Already have an account? <a href="index.html">Sign in →</a>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    $("btnRegister").onclick = async () => {
      const username  = $("username").value.trim();
      const email     = $("email").value.trim();
      const firstName = $("firstName").value.trim();
      const lastName  = $("lastName").value.trim();
      const password  = $("password").value;
      const password2 = $("password2").value;

      if (!username) { showToast("Username is required.", "warn"); return; }
      if (!password) { showToast("Password is required.", "warn"); return; }
      if (password !== password2) { showToast("Passwords do not match.", "warn"); return; }

      try {
        $("btnRegister").disabled = true;
        await apiFetch("/api/accounts/signup/", {
          method: "POST",
          body: {
            username,
            password,
            password2,
            email: email || undefined,
            first_name: firstName || undefined,
            last_name: lastName || undefined,
          }
        });
        showToast("Account created! Redirecting to sign in…", "ok");
        setTimeout(() => go("index.html"), 1800);
      } catch (e) {
        showToast(e.message, "err");
      } finally {
        $("btnRegister").disabled = false;
      }
    };

    $("password2").addEventListener("keydown", e => {
      if (e.key === "Enter") $("btnRegister").click();
    });
  </script>
</body>
</html>
